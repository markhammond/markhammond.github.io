<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Hammond · Projects</title>
  <meta name="description" content="Open-source projects by Mark Hammond: ChalkQL, Tapline, mip-chart, Tsfm.Forecasting, Semifreddo, HeartbeatScheduler and TimerWheel.">
  <meta property="og:title" content="Mark Hammond · Projects">
  <meta property="og:description" content="Open-source building blocks for real-time data, safe SQL, time-series and low-latency .NET.">
  <meta property="og:image" content="assets/img/tapline-waveform.webp">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    // Apply the saved theme before first paint.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">
        <img class="avatar" src="https://avatars.githubusercontent.com/markhammond?s=64" alt="" width="28" height="28">
        <span>Mark Hammond</span>
      </a>
      <nav class="topnav">
        <a href="#projects">Projects</a>
        <a href="#samples">Samples</a>
        <a class="gh-link" href="https://github.com/markhammond" aria-label="markhammond on GitHub">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span>markhammond</span>
        </a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1>Projects</h1>
      <p class="lede" id="tagline"></p>
      <dl class="stats" id="stats"></dl>
    </section>

    <div class="layout">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <button type="button" class="link-btn" id="clear-filters" hidden>Clear</button>
        </div>
        <fieldset>
          <legend>Kind</legend>
          <label><input type="checkbox" name="kind" value="library"> Libraries</label>
          <label><input type="checkbox" name="kind" value="sample"> Tapline samples</label>
        </fieldset>
        <fieldset>
          <legend>Language</legend>
          <div id="lang-filters"></div>
        </fieldset>
        <fieldset>
          <legend>Tags</legend>
          <input type="search" class="tag-search" id="tag-search" placeholder="Search tags…" aria-label="Search tags">
          <div class="tag-list" id="tag-filters"></div>
        </fieldset>
      </aside>

      <section class="results" id="projects" aria-label="Projects">
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></svg>
            <input type="search" id="search" placeholder="Search by name, description or tag…" aria-label="Search projects">
          </label>
          <button type="button" class="btn filters-btn" id="filters-btn" aria-controls="filters" aria-expanded="false">Filters</button>
          <select id="sort" aria-label="Sort">
            <option value="curated">Curated</option>
            <option value="updated">Recently updated</option>
            <option value="stars">Most stars</option>
            <option value="name">Name</option>
          </select>
        </div>
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="grid" id="grid"></div>
        <p class="empty" id="empty" hidden>No projects match those filters.</p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Mark Hammond</span>
    <span>Layout inspired by <a href="https://github.com/embedcatalog/embedcatalog">EmbedCatalog</a></span>
  </footer>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail" id="detail-body"></div>
  </dialog>

  <script src="data/projects.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
