 font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#9ef0b8">+</text><text x="150" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#9ef0b8" xml:space="preserve">WHERE  o.tenant_id = :principal.tenant</text><rect x="90" y="462" width="1020" height="54" rx="8" fill="#9ef0b8" fill-opacity="0.10"/><text x="108" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#9ef0b8">+</text><text x="150" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#9ef0b8" xml:space="preserve">  AND  c.desk IN (SELECT desk FROM grants</text><rect x="90" y="522" width="1020" height="54" rx="8" fill="#9ef0b8" fill-opacity="0.10"/><text x="108" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#9ef0b8">+</text><text x="150" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#9ef0b8" xml:space="preserve">                  WHERE user = :principal)</text><text x="150" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" fill="#e8efe9" xml:space="preserve">GROUP  BY c.region</text><g transform="translate(1010 60)" fill="none" stroke="#9ef0b8" stroke-width="6" stroke-linecap="round"><path d="M20 50V32a30 30 0 0 1 60 0v18"/><rect x="6" y="50" width="88" height="70" rx="12" fill="#1f2b26"/><path d="M50 78v18"/></g></svg>
