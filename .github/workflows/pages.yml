name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily, so stars and versions stay fresh without a commit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot stars, last push and package versions
        run: node scripts/build-live.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pages lets browsers cache files for 10 minutes. Stamping the page's links with
      # the commit makes a freshly loaded page fetch this deploy's script, styles and
      # data instead of mixing in cached copies from the previous one.
      - name: Version-stamp asset links
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(assets/styles\.css|assets/app\.js|data/projects\.js)\"#\1=\"\2?v=${v}\"#g" index.html
          grep -E "\?v=${v}" index.html
          test "$(grep -c "?v=${v}" index.html)" -eq 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
